<!doctype html>
<!-- prettier-ignore -->
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Добре, що ти прийшов · Чай опівночі</title><style>
*{box-sizing:border-box}body{margin:0;background:#182c27;color:#fff3df;font:16px system-ui,sans-serif;min-height:100svh;background:linear-gradient(#10221dcc,#10221de8),url('../walk/assets/forest.webp') center/cover fixed}header{display:flex;justify-content:flex-end;padding:12px 16px}a,button{color:inherit;font:inherit}a:focus-visible,button:focus-visible{outline:3px solid #ffe1a2;outline-offset:3px}header a,.quiet{border:1px solid #e7d8bd88;border-radius:24px;padding:10px 16px;text-decoration:none;background:#172b27}main{width:min(680px,92vw);margin:auto;text-align:center;padding:8px 0 20px}h1{font:clamp(29px,5vw,49px)/1.15 Georgia,serif;margin:12px 0}p{line-height:1.5;margin:10px 0 16px}.places{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.place{min-height:110px;display:grid;place-items:end center;padding:14px 6px;border:1px solid #fff5;border-radius:14px;text-decoration:none;background:linear-gradient(transparent,#10221de8),var(--image) center/cover;font-weight:600}.quiet{display:inline-block;margin-top:15px}#still{position:fixed;inset:0;background:linear-gradient(#10221d44,#10221d99),url('../walk/assets/beach.webp') center/cover;display:grid;place-items:center;padding:24px;text-align:center}#still[hidden]{display:none}#still a{position:absolute;top:12px;right:16px}#still button{position:absolute;bottom:24px;background:#172b27;border:1px solid #fff8;border-radius:24px;padding:12px 20px}@media(max-width:480px){.places{gap:7px}.place{min-height:100px;font-size:14px}header{padding:10px}main{padding-top:0}} header{position:relative;z-index:10000;padding:24px 32px}header a,#still a{font-size:24px;font-weight:700;padding:18px 30px;background:#f2dfbd;color:#20352e;border:2px solid #fff3df;box-shadow:0 4px 20px #0005}main{width:min(1200px,92vw);padding:clamp(24px,8vh,100px) 0 32px}h1{font-size:clamp(42px,6vw,80px)}p{font-size:clamp(20px,2.5vw,30px)}.places{gap:20px}.place{min-height:clamp(150px,24vh,300px);font-size:clamp(22px,3vw,36px)}.quiet{font-size:22px;padding:14px 26px}#still{z-index:10001}@media(max-width:600px){header{padding:16px;justify-content:center}header a,#still a{font-size:18px;padding:14px 20px}main{padding-top:20px}.places{gap:8px}.place{min-height:120px;font-size:18px}h1{font-size:38px}p{font-size:18px}} </style></head><body><header><a href="../../?enter=1" data-enter>Перейти в Чай опівночі</a></header><main><h1>Добре, що ти прийшов.</h1><p>Може, трохи прогуляємося?</p><div class="places"><a class="place" style="--image:url('../walk/assets/forest.webp')" href="../walk/?scene=forest">Ліс</a><a class="place" style="--image:url('../walk/assets/field.webp')" href="../walk/?scene=field">Поле</a><a class="place" style="--image:url('../walk/assets/beach.webp')" href="../walk/?scene=sea">Море</a></div><button class="quiet" id="quiet" type="button">Просто побути</button><p>Тут можна побути собою. Без поспіху, без оцінок, із чашкою теплого чаю.</p></main><section id="still" hidden><a class="quiet" href="../../?enter=1" data-enter>Перейти в Чай опівночі</a><p>Можна нікуди не поспішати.</p><button id="back" type="button">Повернутися</button></section><script>
const key='tea-welcome-seen-v1';const mark=()=>{try{localStorage.setItem(key,'1')}catch{}};document.querySelectorAll('[data-enter]').forEach(a=>a.addEventListener('click',mark));document.querySelectorAll('.place').forEach(a=>a.addEventListener('click',()=>{try{sessionStorage.setItem('tea-walk',JSON.stringify({scene:new URL(a.href).searchParams.get('scene'),started:true,question:0,mood:null,wish:null}))}catch{}mark()}));document.getElementById('quiet').onclick=()=>{document.getElementById('still').hidden=false;document.getElementById('back').focus()};document.getElementById('back').onclick=()=>{document.getElementById('still').hidden=true;document.getElementById('quiet').focus()};
</script></body></html>
