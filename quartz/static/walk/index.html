<!doctype html>
<!-- prettier-ignore -->
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ходімо на чай · Чай опівночі</title><meta name="description" content="Знайди історію, близьку твоєму серцю. Познайомся з Чаєм опівночі."><style>*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#172b29;color:#fff;font:clamp(20px,2vw,30px)/1.4 system-ui}#view{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}header,main{position:relative;z-index:1}header{display:flex;justify-content:flex-end;gap:12px;padding:16px}main{min-height:calc(100dvh - 90px);display:flex;flex-direction:column;justify-content:flex-end;padding:16px}section{width:min(100%,1000px);margin:0 auto;padding:24px;background:rgba(12,25,24,.85);border-radius:20px}h1{font:clamp(32px,4vw,56px)/1.15 Georgia;margin:0 0 12px}p{margin:8px 0}a,button{font:inherit;color:white;background:#20352e;border:1px solid #ddd;border-radius:14px;padding:12px 20px;cursor:pointer;text-decoration:none;display:inline-block}.primary{background:#f1dfc4;color:#24362f;font-weight:700}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}nav{display:flex;justify-content:space-between;align-items:center;margin-top:12px}small{background:#142723;padding:6px 12px;border-radius:12px}button:disabled{opacity:.5}[hidden]{display:none!important}@media(max-width:600px){body{font-size:18px}header{flex-wrap:wrap;padding:8px}main{padding:10px;min-height:calc(100dvh - 100px)}section{padding:16px}}</style></head><body><header><button id="full">⛶ На весь екран</button><a class="primary" href="../../?enter=1">Перейти в Чай опівночі</a></header><main><img id="view" alt="Тихий краєвид" src="assets/forest.webp"><section id="panel" aria-live="polite"></section><nav><button id="back">← Назад</button><small id="progress"></small><button id="next" class="primary">Далі →</button></nav><noscript><p>Для інтерактивної прогулянки увімкни JavaScript.</p><a href="../../?enter=1">Увійти в Чай</a></noscript></main><script>
const scenes={forest:'forest.webp',field:'field.webp',sea:'beach.webp'};
let scene=new URLSearchParams(location.search).get('scene');const view=document.getElementById('view');view.src='assets/'+(scenes[scene]||scenes.forest);
const work='../../'+['Поезія присутності','7 Твій рай','0 Уривки','Дорослі проблеми'].map(s=>encodeURIComponent(s.replace(/ /g,'-'))).join('/') ;
const bot='https://t.me/Midnight_tea_bookstore_bot';
const pages=[
'<h1>О, ти прийшов!</h1><p>Як ти сьогодні?</p><p>Хочеш, трохи прогуляємося? А якщо втомився, можемо просто посидіти й подивитися на небо.</p><div class="actions"><button data-scene="forest">Ліс</button><button data-scene="field">Поле</button><button data-scene="sea">Море</button><button data-quiet>Просто побути</button></div>',
'<h1>Бувало в тебе таке?</h1><p>Цілий день відповідаєш усім: «Та нормально, все добре».</p><p>А ввечері приходиш додому, зачиняєш двері — і нарешті можна перестати усміхатися.</p><p>А коли востаннє ти мав час просто подивитися на зорі?</p><div class="actions"><button data-go="2">Я не встигаю відпочивати</button><button data-go="3">Хочу дізнатися про Чай</button></div>',
'<h1>Дорослі проблеми</h1><p>Хочу поділитися з тобою одним твором зі збірки «Твій рай».</p><div class="actions"><a class="primary" href="https://www.youtube.com/watch?v=qwuRrq_X0Vo" target="_blank" rel="noopener">Послухати твір</a><a href="'+work+'" target="_blank" rel="noopener">Відкрити сторінку твору</a></div><p>Хочеш забрати цю історію додому?</p><div class="actions"><a href="'+bot+'" target="_blank" rel="noopener">Замовити «Твій рай» у книгарні</a></div><small>У боті обери збірку «Твій рай».</small>',
'<h1>А в тебе таке бувало?</h1><p>Читаєш книжку й раптом зупиняєшся.</p><p>«Боже, та це ж про мене! Я теж так почуваюся!»</p><p>А ще кілька сторінок — і вже хочеться обійняти героя. Бо знаєш, як йому болить.</p><p>А потім хтось обіймає його. І ти, сидячи з книжкою в руках, теж відчуваєш тепло.</p><p>Саме на цьому переживанні ґрунтується наш авторський психологічний метод — СТБ. Він створений для підтримки людини у стані психологічного захисту.</p>',
'<h1>Історії, до яких можна повертатися</h1><p>У Чаї опівночі можна знаходити твори за почуттями та життєвими ситуаціями. Ти маєш свободу знаходити власні відповіді на власні запитання.</p><p>А якщо сьогодні не хочеться читати — тут є прогулянки, музика, кімната без маски та стабілізатор.</p><div class="actions"><a href="../../?enter=1">Познайомитися з бібліотекою</a></div>',
'<h1>Ну що, ходімо на чай?</h1><p>Можливо, серед наших історій ти знайдеш ту, до якої захочеться повертатися. Її можна забрати додому — у паперовій книжці, навіть з особистим підписом авторки.</p><div class="actions"><a class="primary" href="../../?enter=1">Увійти в Чай</a><a href="'+bot+'" target="_blank" rel="noopener">Замовити книжку</a><a href="../../Книгарня">Познайомитися з книгарнею</a></div>'
];const galleries={forest:['assets/forest.webp'],field:['assets/field.webp'],sea:['assets/beach.webp','assets/sea.jpg','../listening-scenes/sea.jpg']};let step=0;function updateView(){const g=galleries[scene]||galleries.forest;view.src=new URL(g[step%g.length],location.href).href;view.dataset.step=String(step);const preload=new Image();preload.src=new URL(g[(step+1)%g.length],location.href).href;}const panel=document.getElementById('panel'),back=document.getElementById('back'),next=document.getElementById('next');function render(){updateView();panel.innerHTML=pages[step];back.disabled=step===0;next.hidden=step===pages.length-1;document.getElementById('progress').textContent=(step+1)+' / '+pages.length;panel.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{scene=b.dataset.scene;updateView();});panel.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{step=Number(b.dataset.go);render()});const q=panel.querySelector('[data-quiet]');if(q)q.onclick=()=>{panel.innerHTML='<h1>Можемо нікуди не поспішати.</h1><button id="resume">Повернутися до прогулянки</button>';document.getElementById('resume').onclick=render;};window.scrollTo(0,0)}back.onclick=()=>{if(step>0){step--;render()}};next.onclick=()=>{if(step<pages.length-1){step++;render()}};render();document.getElementById('full').onclick=async()=>{try{if(document.fullscreenElement){await document.exitFullscreen()}else{await document.documentElement.requestFullscreen()}}catch(e){document.getElementById('full').textContent='F11 — на весь екран'}};document.addEventListener('fullscreenchange',()=>{document.getElementById('full').textContent=document.fullscreenElement?'Вийти з повного екрана':'⛶ На весь екран'});
</script></body></html>
