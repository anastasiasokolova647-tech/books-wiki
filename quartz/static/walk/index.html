<!doctype html>
<!-- prettier-ignore -->
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ходімо на чай · Чай опівночі</title><meta name="description" content="Знайди історію, близьку твоєму серцю. Познайомся з Чаєм опівночі."><style>
*{box-sizing:border-box}body{margin:0;color:#fff5e8;background:#172b29;font:18px/1.55 system-ui,sans-serif}header{display:flex;justify-content:flex-end;padding:16px;position:relative}a,button{font:inherit;color:inherit}a,button{border:1px solid #e9d8bd88;border-radius:18px;padding:12px 20px;background:#20352ee8;text-decoration:none;cursor:pointer;display:inline-block}a:focus-visible,button:focus-visible{outline:3px solid #ffe2a8;outline-offset:3px}.primary{background:#f1dfc4;color:#24362f;font-weight:700}main{width:min(850px,94vw);margin:auto;padding-bottom:24px}img{width:100%;height:clamp(150px,34vh,380px);object-fit:cover;border-radius:20px}section{background:#142723;padding:clamp(18px,4vw,36px);border-radius:20px;margin-top:12px}h1{font:clamp(28px,5vw,44px)/1.2 Georgia,serif;margin:0 0 14px}p{margin:12px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}small{color:#e1d8ca} [hidden]{display:none!important}@media(max-width:500px){header{justify-content:center}nav button{padding:10px}section{padding:18px}}
</style></head><body><header><a class="primary" href="../../?enter=1">Перейти в Чай опівночі</a></header><main><img id="view" alt="Тихий краєвид" src="assets/forest.webp"><section id="panel" aria-live="polite"></section><nav><button id="back">← Назад</button><small id="progress"></small><button id="next" class="primary">Далі →</button></nav><noscript><p>Для інтерактивної прогулянки увімкни JavaScript.</p><a href="../../?enter=1">Увійти в Чай</a></noscript></main><script>
const scenes={forest:'forest.webp',field:'field.webp',sea:'beach.webp'};
const scene=new URLSearchParams(location.search).get('scene');const view=document.getElementById('view');view.src='assets/'+(scenes[scene]||scenes.forest);
const work='../../'+['Поезія присутності','7 Твій рай','0 Уривки','Дорослі проблеми'].map(s=>encodeURIComponent(s.replace(/ /g,'-'))).join('/') ;
const bot='https://t.me/Midnight_tea_bookstore_bot';
const pages=[
'<h1>О, ти прийшов!</h1><p>Як ти сьогодні?</p><p>Хочеш, трохи прогуляємося? А якщо втомився, можемо просто посидіти й подивитися на небо.</p><div class="actions"><button data-scene="forest">Ліс</button><button data-scene="field">Поле</button><button data-scene="sea">Море</button><button data-quiet>Просто побути</button></div>',
'<h1>Бувало в тебе таке?</h1><p>Цілий день відповідаєш усім: «Та нормально, все добре».</p><p>А ввечері приходиш додому, зачиняєш двері — і нарешті можна перестати усміхатися.</p><p>А коли востаннє ти мав час просто подивитися на зорі?</p><div class="actions"><button data-go="2">Я не встигаю відпочивати</button><button data-go="3">Хочу дізнатися про Чай</button></div>',
'<h1>Дорослі проблеми</h1><p>Хочу поділитися з тобою одним твором зі збірки «Твій рай».</p><div class="actions"><a class="primary" href="https://www.youtube.com/watch?v=qwuRrq_X0Vo" target="_blank" rel="noopener">Послухати твір</a><a href="'+work+'" target="_blank" rel="noopener">Відкрити сторінку твору</a></div><p>Хочеш забрати цю історію додому?</p><div class="actions"><a href="'+bot+'" target="_blank" rel="noopener">Замовити «Твій рай» у книгарні</a></div><small>У боті обери збірку «Твій рай».</small>',
'<h1>А в тебе таке бувало?</h1><p>Читаєш книжку й раптом зупиняєшся.</p><p>«Боже, та це ж про мене! Я теж так почуваюся!»</p><p>А ще кілька сторінок — і вже хочеться обійняти героя. Бо знаєш, як йому болить.</p><p>А потім хтось обіймає його. І ти, сидячи з книжкою в руках, теж відчуваєш тепло.</p><p>Саме на цьому переживанні ґрунтується наш авторський психологічний метод — СТБ. Він створений для підтримки людини у стані психологічного захисту.</p>',
'<h1>Історії, до яких можна повертатися</h1><p>У Чаї опівночі можна знаходити твори за почуттями та життєвими ситуаціями. Ти маєш свободу знаходити власні відповіді на власні запитання.</p><p>А якщо сьогодні не хочеться читати — тут є прогулянки, музика, кімната без маски та стабілізатор.</p><div class="actions"><a href="../../?enter=1">Познайомитися з бібліотекою</a></div>',
'<h1>Ну що, ходімо на чай?</h1><p>Можливо, серед наших історій ти знайдеш ту, до якої захочеться повертатися. Її можна забрати додому — у паперовій книжці, навіть з особистим підписом авторки.</p><div class="actions"><a class="primary" href="../../?enter=1">Увійти в Чай</a><a href="'+bot+'" target="_blank" rel="noopener">Замовити книжку</a><a href="../../Книгарня">Познайомитися з книгарнею</a></div>'
];let step=0;const panel=document.getElementById('panel'),back=document.getElementById('back'),next=document.getElementById('next');function render(){panel.innerHTML=pages[step];back.disabled=step===0;next.hidden=step===pages.length-1;document.getElementById('progress').textContent=(step+1)+' / '+pages.length;panel.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{view.src='assets/'+scenes[b.dataset.scene];});panel.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{step=Number(b.dataset.go);render()});const q=panel.querySelector('[data-quiet]');if(q)q.onclick=()=>{panel.innerHTML='<h1>Можемо нікуди не поспішати.</h1><button id="resume">Повернутися до прогулянки</button>';document.getElementById('resume').onclick=render;};window.scrollTo(0,0)}back.onclick=()=>{if(step>0){step--;render()}};next.onclick=()=>{if(step<pages.length-1){step++;render()}};render();
</script></body></html>
