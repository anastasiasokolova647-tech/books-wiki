<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Біблійний пошук — Чай опівночі</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #0b1524;
        color: #f2e7dd;
        font:
          18px/1.6 system-ui,
          sans-serif;
      }
      main {
        max-width: 800px;
        margin: auto;
        padding: 24px;
      }
      a {
        color: #e9b58e;
      }
      h1 {
        font:
          2rem Georgia,
          serif;
        color: #e9b58e;
      }
      input {
        width: 100%;
        padding: 14px;
        border: 1px solid #d49b77;
        border-radius: 12px;
        background: #172235;
        color: inherit;
        font: inherit;
      }
      article {
        border: 1px solid #465063;
        border-radius: 12px;
        padding: 16px;
        margin: 12px 0;
      }
      article a {
        font-weight: bold;
      }
      small {
        display: block;
        color: #d8cfc7;
      }
      p {
        margin: 8px 0;
      }
      #status {
        min-height: 2em;
      }
    </style>
  </head>
  <body>
    <main>
      <a href="../../">← Чай опівночі</a>
      <h1>📖 Біблійний пошук</h1>
      <p>Знайди твори за біблійним віршем, словами цитати, назвою твору або книжки.</p>
      <label for="q">Що шукаємо?</label
      ><input id="q" type="search" placeholder="Наприклад: Івана 11:35, плачте, Ліхтар" />
      <p id="status" role="status" aria-live="polite">Завантаження покажчика…</p>
      <div id="results"></div>
    </main>
    <script>
      const q = document.getElementById("q"),
        results = document.getElementById("results"),
        status = document.getElementById("status")
      let rows = []
      const norm = (s) =>
        String(s)
          .normalize("NFKC")
          .toLocaleLowerCase("uk")
          .replace(/[’ʼ']/g, "")
          .replace(/\s+/g, " ")
          .trim()
      function render() {
        const terms = norm(q.value).split(" ").filter(Boolean)
        const found = rows.filter((r) => terms.every((t) => r.search.includes(t)))
        results.replaceChildren()
        status.textContent = "Знайдено творів: " + found.length + " із " + rows.length
        for (const r of found) {
          const a = document.createElement("article"),
            link = document.createElement("a"),
            meta = document.createElement("small"),
            p = document.createElement("p")
          link.href = new URL(
            "../../" + r.slug.split("/").map(encodeURIComponent).join("/"),
            location.href,
          ).href
          link.textContent = r.title
          meta.textContent = r.book
          p.textContent = r.epigraph
          a.append(link, meta, p)
          results.append(a)
        }
      }
      q.addEventListener("input", render)
      fetch("../contentIndex.json")
        .then((r) => {
          if (!r.ok) throw Error("index")
          return r.json()
        })
        .then((data) => {
          for (const [slug, item] of Object.entries(data)) {
            const content = String(item.content || "")
            const match = content.match(/Біблійний епіграф\s*([\s\S]*?)(?=\s+Запит(?:\s|$)|$)/i)
            if (!match) continue
            const epigraph = match[1].trim()
            const book = slug.split("/").slice(0, 2).join(" / ").replace(/-/g, " ")
            const title = item.title || slug.split("/").pop()
            rows.push({
              slug,
              title,
              book,
              epigraph,
              search: norm(title + " " + book + " " + epigraph),
            })
          }
          rows.sort((a, b) => a.title.localeCompare(b.title, "uk"))
          render()
        })
        .catch(() => {
          status.textContent = "Не вдалося завантажити покажчик. Оновіть сторінку трохи пізніше."
        })
    </script>
  </body>
</html>
