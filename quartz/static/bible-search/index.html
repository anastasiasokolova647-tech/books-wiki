<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Біблійний пошук — Чай опівночі</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #0b1524;
        color: #f2e7dd;
        font:
          18px/1.6 system-ui,
          sans-serif;
      }
      main {
        max-width: 800px;
        margin: auto;
        padding: 24px;
      }
      a {
        color: #e9b58e;
      }
      h1 {
        font:
          2rem Georgia,
          serif;
        color: #e9b58e;
      }
      input,
      select {
        width: 100%;
        padding: 14px;
        border: 1px solid #d49b77;
        border-radius: 12px;
        background: #172235;
        color: inherit;
        font: inherit;
      }
      article {
        border: 1px solid #465063;
        border-radius: 12px;
        padding: 16px;
        margin: 12px 0;
      }
      article a {
        font-weight: bold;
      }
      small {
        display: block;
        color: #d8cfc7;
      }
      p {
        margin: 8px 0;
      }
      article {
        overflow-wrap: anywhere;
      }
      select {
        margin-bottom: 16px;
      }
      #status {
        min-height: 2em;
      }
    </style>
  </head>
  <body>
    <main>
      <a href="../../">← Чай опівночі</a>
      <h1>📖 Біблійний пошук</h1>
      <p>Знайди твори за біблійним віршем, словами цитати, назвою твору або книжки.</p>
      <label for="q">Що шукаємо?</label
      ><input id="q" type="search" placeholder="Наприклад: Івана 11:35, плачте, Ліхтар" />
      <label for="book">Книжка</label
      ><select id="book">
        <option value="">Усі книжки</option>
      </select>
      <p id="status" role="status" aria-live="polite">Завантаження покажчика…</p>
      <p>
        Аудит усієї бібліотеки триває. Покажчик містить уже додані паралелі, а не повний перелік
        творів.
        <a
          href="https://github.com/anastasiasokolova647-tech/books-wiki/blob/v5/audits/bible/progress.md"
          >Перебіг перевірки за книжками</a
        >
      </p>
      <div id="results"></div>
    </main>
    <script type="module">
      import { matches } from "./search.mjs"
      const q = document.getElementById("q"),
        book = document.getElementById("book"),
        results = document.getElementById("results"),
        status = document.getElementById("status")
      let rows = []
      function render() {
        const found = rows.filter((r) => matches(r, q.value, book.value))
        results.replaceChildren()
        status.textContent = `Результатів пошуку: ${found.length}. Із біблійними паралелями у вибраній книжці: ${rows.filter((r) => !book.value || r.book === book.value).length}; у всьому покажчику: ${rows.length}.`
        for (const r of found) {
          const card = document.createElement("article"),
            link = document.createElement("a"),
            meta = document.createElement("small"),
            p = document.createElement("p"),
            refs = document.createElement("p")
          link.href = new URL(
            "../../" + r.slug.split("/").map(encodeURIComponent).join("/"),
            location.href,
          ).href
          link.textContent = r.title
          meta.textContent = r.book
          p.textContent = r.epigraph
          for (const ref of r.references) {
            const a = document.createElement("a")
            a.href = ref.url
            a.textContent = ref.label
            refs.append(a, document.createTextNode(" · "))
          }
          card.append(link, meta, p, refs)
          results.append(card)
        }
      }
      q.addEventListener("input", render)
      book.addEventListener("change", render)
      fetch("./index.json", { cache: "no-cache" })
        .then((r) => {
          if (!r.ok) throw Error("index")
          return r.json()
        })
        .then((data) => {
          rows = data.works
          for (const name of [...new Set(rows.map((r) => r.book))].sort((a, b) =>
            a.localeCompare(b, "uk"),
          )) {
            const o = document.createElement("option")
            o.value = name
            o.textContent = name
            book.append(o)
          }
          render()
        })
        .catch(() => {
          status.textContent = "Не вдалося завантажити покажчик. Оновіть сторінку трохи пізніше."
        })
    </script>
  </body>
</html>
