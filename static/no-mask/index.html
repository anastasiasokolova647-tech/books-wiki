<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B1524" />
    <title>Кімната без маски — Чай опівночі</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1524;
        color: #f2e7dd;
        font:
          18px/1.65 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        padding: 24px;
      }
      main {
        width: min(100%, 640px);
        padding: clamp(24px, 5vw, 48px);
        border: 1px solid #5d4d49;
        border-radius: 24px;
        background: #142034;
      }
      h1 {
        font:
          normal clamp(30px, 5vw, 44px)/1.2 Georgia,
          serif;
        color: #e9b58e;
      }
      p {
        max-width: 48ch;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }
      a {
        color: #e9b58e;
        border: 1px solid #d49b77;
        border-radius: 999px;
        padding: 10px 18px;
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Кімната без маски</h1>
      <p>Тут можна буде побути собою без необхідності щось пояснювати.</p>
      <p>
        Ця кімната поки недоступна. Ми залишили для тебе шлях назад, щоб не зустрічала порожня
        сторінка.
      </p>
      <nav aria-label="Навігація">
        <a href="../../">← На головну</a><a href="../../stabilizer/">Стабілізатор</a
        ><a href="../../Книгарня">Книгарня</a>
      </nav>
    </main>
  </body>
</html>
