name: Audit internal links and orphan cards
on:
  push:
    branches: [v5]
    paths:
      - scripts/audit-internal-links.mjs
      - .github/workflows/audit-links.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit Quartz content links
        run: node scripts/audit-internal-links.mjs
